# 🌀 台風ページの予備文章の見張り番
#
# 台風ページは4段構えで中身を出します。
#   ① ブラウザから気象庁へ直接 ② data/latest.json（毎時25分に自動更新）
#   ③ 端末に残った前回のデータ ④ 手書きのスナップショット（最後の受け皿）
#
# ①〜③は勝手に新しくなりますが、**④だけは手書き**なので、
# だれも直さないかぎり何か月でも古いまま残ります。
# （2026-08-22 に点検したとき、④は12日前＝もう存在しない台風15号の話のままでした）
#
# 📅 2026-08-31 に「週に1回」から「毎日」へ変更しました。
#    実測で、④は**7日の期限より先に腐る**ことが分かったためです。
#    8月29日に更新した④が、わずか1.8日後の8月31日には
#    「台風18号が気象庁の情報から消えた」せいで顔ぶれがズレ、❌になりました。
#    日付の物差し（7日）はセーフでも、中身の物差し（台風番号の照合）が先に切れます。
#    週に1回では、その状態が最大6日間そのまま残ってしまいます。
#
# 📝 お知らせのIssueには**差し替え用の下書き**を貼り付けます。
#    tools/typhoon_snapshot_draft.py が控えデータから作るもので、
#    ヘッダーの日時・但し書き・発生中の台風・今後の見通しは、そのまま貼れます。
#    （まとめ文・通過した台風・マップは、人が書く部分です）
#    ⚠️ 下書きは「貼るための材料」であって、そのまま反映してよい保証ではありません。
#    ④は「人が気象庁と見くらべて確かめた文章」であることに意味があります。
#
# 🔁 すでにお知らせのIssueが開いているときは、**新しく立てずに中身だけ差し替え**ます。
#    毎日走るので、放っておくと下書きのほうが古くなってしまうためです。
#    （コメントを足すと毎日通知が飛ぶので、本文の差し替えにしています）
#
# 📌 わざと「PRのときには走らせない」ようにしています。
#    ④の古さは、そのPRのせいではないことがほとんどなので、
#    関係のないPRに赤いバツを付けて止めてしまわないためです。
#
# 手で今すぐ動かしたいときは、GitHubの Actions タブ
# →「🌀 台風ページの予備文章の見張り番」→「Run workflow」。

name: 🌀 台風ページの予備文章の見張り番

on:
  schedule:
    # 毎日 22:10 UTC ＝ 日本時間の翌朝 7:10
    # （台風＝毎時25分・防災＝毎時35分・台帳＝火曜5:10 とぶつからない時刻）
    - cron: '10 22 * * *'
  workflow_dispatch: # 手動実行用のボタン

permissions:
  contents: read # リポジトリは読むだけ
  issues: write # 古くなったときにお知らせのIssueを立てる／中身を差し替える／直ったら閉じる

concurrency:
  group: typhoon-snapshot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 万一固まっても10分で打ち切る（Actionsの無料枠を守る保険）
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 予備の文章（④）の古さを点検
        id: check
        run: |
          # 「古い」ときスクリプトは終了コード1を返す。
          # ここで止まってほしくないので、いったん set +e で止まらないようにして受け取る。
          set +e
          python3 tools/check_typhoon_snapshot.py > result.txt 2>&1
          code=$?
          set -e
          cat result.txt
          echo "点検の終了コード: $code"
          if [ "$code" -eq 0 ]; then
            echo "stale=no" >> "$GITHUB_OUTPUT"
          else
            echo "stale=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 差し替え用の下書きを作る
        if: steps.check.outputs.stale == 'yes'
        run: |
          # この道具はファイルを書き換えず、画面に出すだけ。
          # 控え（data/latest.json）が読めないと失敗するので、止まらないように受ける。
          set +e
          python3 tools/typhoon_snapshot_draft.py > draft.txt 2>&1
          code=$?
          set -e
          echo "下書きの終了コード: $code"
          if [ "$code" -ne 0 ]; then
            echo '（下書きを作れませんでした。控えのデータが読めなかった可能性があります）' > draft.txt
          fi
          cat draft.txt

      - name: 古ければお知らせのIssueを立てる／中身を差し替える／直っていれば閉じる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE: ${{ steps.check.outputs.stale }}
          TITLE: '🌀 台風ページの予備の文章（④）が古くなっています'
        run: |
          set -euo pipefail

          # 同じお知らせが何枚も立たないよう、すでに開いている1枚を探す
          # 見出しに絵文字が入るので、シェルに解釈させず jq の --arg で安全に渡す
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')

          if [ "$STALE" = "yes" ]; then
            {
              echo '台風ページの **④予備の文章（手書きのスナップショット）** が古くなっています。'
              echo
              echo '④は「気象庁にも控えにも端末にもつながらないとき」に出る**最後の受け皿**です。'
              echo 'ふだんは見えませんが、いざというときに古い台風の話が出てしまいます。'
              echo
              echo '## 点検の結果'
              echo
              echo '```'
              cat result.txt
              echo '```'
              echo
              echo '## 差し替え用の下書き'
              echo
              echo '控えのデータ（`typhoon-app/data/latest.json`）から作った下書きです。'
              echo '**ヘッダーの日時・但し書き・発生中の台風・今後の見通し**は、ほぼそのまま貼れます。'
              echo
              echo '> ⚠️ これは「貼るための材料」であって、そのまま反映してよいという保証ではありません。'
              echo '> ④は**人が気象庁と見くらべて確かめた文章**であることに意味があります。'
              echo '> 「いま日本はどうなの？」のまとめ文・「すでに通過した台風」・🗾マップは、人が書く部分です。'
              echo
              echo '<details>'
              echo '<summary>下書きを開く</summary>'
              echo
              echo '```'
              cat draft.txt
              echo '```'
              echo
              echo '</details>'
              echo
              echo '## 直しかた'
              echo
              echo 'Claudeに「**台風ページの予備の文章を更新して**」と頼んでください。'
              echo '直ると、この Issue は次回の見張り（毎日 朝7:10）で自動的に閉じます。'
              echo
              echo '---'
              # 日本時間は「UTCに9時間足す」で出す。TZ=Asia/Tokyo は tzdata が
              # 入っていない環境だと黙ってUTCのまま出てしまう（手元で実際に9時間ズレた）。
              echo "_この本文は毎日の見張りで最新に差し替わります（最終更新：$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') 日本時間）_"
              echo '_Generated by [Claude Code](https://claude.ai/code)_'
            } > body.md

            if [ -n "$number" ]; then
              # 毎日走るので、放っておくと下書きのほうが古くなる。
              # コメントを足すと毎日通知が飛ぶため、本文だけ静かに差し替える。
              gh issue edit "$number" --body-file body.md
              echo "すでにある Issue #$number の中身を、今日の下書きに差し替えました。"
            else
              gh issue create --title "$TITLE" --body-file body.md
              echo "お知らせのIssueを立てました。"
            fi
          else
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --comment $'✅ 予備の文章（④）が新しくなったことを確認したので、このお知らせを閉じます。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
              echo "Issue #$number を閉じました。"
            else
              echo "④は新しいままです。お知らせすることはありません。"
            fi
          fi
