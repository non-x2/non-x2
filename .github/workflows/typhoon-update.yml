# 🌀 台風情報の自動更新
#
# 気象庁の公式データを1時間ごとに取ってきて、typhoon-app/data/latest.json を書き換えます。
# これが動いていれば、Claude を開かなくても公開ページ（GitHub Pages）が新しくなります。
#
# 発表内容に変わりがない回はコミットしません（履歴が無駄に増えないように）。
# 手で今すぐ動かしたいときは、GitHubの Actions タブ →「🌀 台風情報の自動更新」→「Run workflow」。

name: 🌀 台風情報の自動更新

on:
  schedule:
    # UTCで毎時25分＝日本時間の毎時25分に実行（GitHubが混む正時を避けています）
    - cron: '25 * * * *'
  workflow_dispatch: # 手動実行用のボタン

permissions:
  contents: write # data/latest.json を書き戻すために必要

concurrency:
  group: typhoon-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 気象庁から台風情報を取得
        run: python3 typhoon-app/scripts/fetch_typhoon.py

      - name: 変わっていればコミットして反映
        run: |
          if [ -z "$(git status --porcelain typhoon-app/data)" ]; then
            echo "変更なし。コミットはしません。"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add typhoon-app/data
          git commit -m '🌀 台風情報データを自動更新（気象庁）'
          # 同時刻に他の更新が入っていた場合に備えて、取り込んでから押す
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "リトライ $i"
            sleep 5
          done
          exit 1
