# 🚦 交通量データの自動更新
#
# 国土交通省の「交通量API」から、全国の高速道路・国道の観測点（約1,000か所）の
# 「5分間に通った車の台数」を1時間ごとに取ってきて、
# traffic-app/data/road_status.json を書き換えます。
# くらべる相手として「1週間前の同じ時刻」もいっしょに取ります
# （ページ側で「いつもより多い／少ない」を色分けするため）。
#
# 取得に失敗した回は、ファイルを書き換えずに終わります（安全装置。T12の教訓）。
# 変わりがない回はコミットしません（履歴が無駄に増えないように）。
# 手で今すぐ動かしたいときは、GitHubの Actions タブ →「🚦 交通量データの自動更新」→「Run workflow」。

name: 🚦 交通量データの自動更新

on:
  schedule:
    # UTCで毎時45分＝日本時間の毎時45分に実行
    # （台風=毎時25分・防災=毎時35分とぶつからない時刻にしています）
    - cron: '45 * * * *'
  workflow_dispatch: # 手動実行用のボタン

permissions:
  contents: write # data/road_status.json を書き戻すために必要

concurrency:
  group: traffic-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 万一固まっても10分で打ち切る（Actionsの無料枠を守る保険）
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 交通量データを取得
        run: python3 traffic-app/scripts/fetch_road_status.py

      - name: 変わっていればコミットして反映
        run: |
          if [ -z "$(git status --porcelain traffic-app/data)" ]; then
            echo "変更なし。コミットはしません。"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic-app/data
          git commit -m '🚦 交通量データを自動更新（国土交通省）'
          # 同時刻に他の更新が入っていた場合に備えて、取り込んでから押す
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "リトライ $i"
            sleep 5
          done
          exit 1
