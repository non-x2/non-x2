# 🌐 ページをインターネットに公開（GitHub Pages）
#
# ふだんは何もしなくて大丈夫です。main が新しくなるたび、
# ここが自動で「公開しなおし」をします。
#
# ポイント：Pages がまだオンになっていない場合、この仕掛けが
# 「オンにするところから」自動でやります（enablement: true）。
# → のんさんが Settings 画面を開いて設定する必要はありません。
#
# 公開後のURL： https://non-x2.github.io/non-x2/typhoon-app/
#
# 🔒 公開するのは「入口ページ（index.html）」「台風ページ（typhoon-app/）」
#    「防災ページ（bousai-app/）」だけです。
#    作業ログ・脚本・YouTubeの型などは、ホームページとしては公開しません。

name: 🌐 ページを公開（GitHub Pages）

on:
  push:
    branches: [main] # main が更新されたら公開しなおす
  workflow_run:
    # 台風・防災データの自動更新が終わったあとにも公開しなおす。
    # （GitHubの仕様で、自動更新が行うコミットは push 扱いにならないため必要）
    workflows: ['🌀 台風情報の自動更新', '⚡ 防災情報の自動更新']
    types: [completed]
  workflow_dispatch: # 手動実行用のボタン

permissions:
  contents: read
  pages: write # Pages をオンにする＋公開するために必要
  id-token: write # 公開時の本人確認に必要

# 公開作業が重ならないようにする（あとから来たほうを待たせる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 【1段目】まず Pages をオンにする（まだオフの場合）。
  # わざと deploy と分けています：公開先の「環境」には門番がいて、
  # Pages がオフのままだと deploy ジョブを開始前に弾いてしまうため、
  # 門番のいないこのジョブで先にオンにしておく必要があります。
  # （2026-08-01 の初回実行はこれで失敗した → トラブル解決記録 T15）
  setup:
    # 台風データの更新が失敗した回は、公開しなおさない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Pagesの準備（まだオフなら自動でオンにする）
        uses: actions/configure-pages@v5
        with:
          enablement: true

  # 【2段目】実際に公開する
  deploy:
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # 🔒 公開するのは「入口ページ」「台風ページ」「防災ページ」だけ。
      #    作業ログ・脚本・YouTubeの型などはGitHub上に置いたままにして、
      #    ホームページとしては出しません（検索に載る範囲を必要最小限にするため）。
      - name: 公開するファイルだけを集める
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r typhoon-app _site/
          cp -r bousai-app _site/
          echo "--- 公開されるファイル ---"
          find _site -type f | sort

      - name: 公開するファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
