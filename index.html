<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>のんラボ</title>
    <meta name="description" content="のんラボ（個人開発ラボ）の公開ページ。" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1f24;
        --muted: #5b6472;
        --line: #e3e6ea;
        --accent: #0b6bcb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151a;
          --card: #1a1f26;
          --text: #e8ecf1;
          --muted: #9aa5b4;
          --line: #2a313b;
          --accent: #6db3ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem 3rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        line-height: 1.75;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 2rem;
        font-size: 0.95rem;
      }
      a.card {
        display: block;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.1rem 1.25rem;
        margin-bottom: 0.9rem;
        text-decoration: none;
        color: inherit;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
      }
      .card-title {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .card-desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 0.2rem;
      }
      footer {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.85rem;
        border-top: 1px solid var(--line);
        padding-top: 1rem;
      }
      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>のんラボ</h1>
      <p class="lead">個人がAIで何をつくれるか、を試している小さなラボです。</p>

      <a class="card" href="./typhoon-app/">
        <div class="card-title">🌀 台風情報まとめ</div>
        <div class="card-desc">
          気象庁の発表をもとに、いまの台風・これからの見通し・進路の地図をまとめた防災ページ。1時間ごとに自動で新しくなります。
        </div>
      </a>

      <footer>
        ソースコード：<a href="https://github.com/non-x2/non-x2">github.com/non-x2/non-x2</a><br />
        ⚠️ 防災の判断は、必ず気象庁とお住まいの自治体の最新の発表に従ってください。
      </footer>
    </main>
  </body>
</html>
